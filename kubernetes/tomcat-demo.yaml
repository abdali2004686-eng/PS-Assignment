apiVersion: apps/v1
kind: Deployment
metadata:
  name: tomcat-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tomcat-demo
  template:
    metadata:
      labels:
        app: tomcat-demo
    spec:
      containers:
        - name: ps-tomcat-webapp
          image: abdallah6868/ps-tomcat-webapp:1.0
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: tomcat-demo
spec:
  type: NodePort
  selector:
    app: tomcat-demo
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 32684
